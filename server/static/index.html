<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vanilaChatbot</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<form id="login" hidden>
  <h1>vanilaChatbot</h1>
  <label for="login-user">사용자</label>
  <input id="login-user" autocomplete="username" autocapitalize="off" spellcheck="false" required>
  <label for="login-password">비밀번호</label>
  <input id="login-password" type="password" autocomplete="current-password" required>
  <p id="login-error" role="alert"></p>
  <button class="primary" type="submit">로그인</button>
</form>
<div id="app" hidden>
  <aside id="side">
    <div class="row between first">
      <span id="whoami"></span>
      <button id="logout">로그아웃</button>
    </div>
    <label for="project">프로젝트</label>
    <div class="row">
      <select id="project"></select>
      <button id="new-project" title="새 프로젝트">새로</button>
    </div>
    <div class="row between">
      <span class="label">대화</span>
      <button id="new-session">새 대화</button>
    </div>
    <ul id="sessions"></ul>
    <div class="split" data-list="sessions" role="separator" aria-orientation="horizontal" tabindex="0"
         aria-label="대화 목록 높이 조절" title="끌어서 높이 조절 (더블클릭: 자동)"></div>
    <div class="row between">
      <span class="label">파일</span>
      <span class="row">
        <button id="file-upload" title="선택한 폴더에 파일 올리기">올리기</button>
        <button id="file-folder" title="선택한 폴더 안에 새 폴더">새 폴더</button>
      </span>
    </div>
    <input id="file-input" type="file" multiple hidden>
    <ul id="files" title="파일을 끌어 폴더에 놓으면 옮겨져요. 컴퓨터의 파일·폴더를 끌어 놓으면 올라가요."></ul>
    <div class="split" data-list="files" role="separator" aria-orientation="horizontal" tabindex="0"
         aria-label="파일 목록 높이 조절" title="끌어서 높이 조절 (더블클릭: 자동)"></div>
    <span class="label">아티팩트</span>
    <ul id="artifacts"></ul>
  </aside>

  <main id="chat">
    <button id="side-toggle" title="사이드바 숨기기" aria-label="사이드바 숨기기">☰</button>
    <div id="messages"></div>
    <form id="composer">
      <textarea id="input" rows="3" placeholder="메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button id="send" type="submit">보내기</button>
    </form>
  </main>

  <div id="resizer" role="separator" aria-orientation="vertical" aria-label="채팅과 아티팩트 폭 조절" tabindex="0"
       title="끌어서 폭 조절 (← → 키도 됨, 더블클릭하면 처음 폭으로)"></div>
  <section id="panel" hidden>
    <header>
      <h2 id="art-title"></h2>
      <select id="art-version" title="버전"></select>
      <button id="art-source">코드</button>
      <button id="art-expand" title="크게 보기 (Esc로 돌아오기)">크게</button>
      <button id="art-close" title="닫기">닫기</button>
    </header>
    <div id="art-sections" hidden></div>
    <div id="frame-wrap"></div>
    <pre id="art-code" hidden></pre>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
